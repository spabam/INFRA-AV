[package]
name = "infra-av-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
actix-cors = "0.7.1"
actix-web = "4.11.0"
anyhow = "1.0.100"
bcrypt = "0.17.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"] }
env_logger = "0.11.8"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
libc = "0.2.177"
log = "0.4.28"
pam-client = "0.5.0"
regex = "1.11.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
